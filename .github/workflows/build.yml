name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify core and WAL HA
        run: ./mvnw -B -f wal-ha-reactor/pom.xml clean verify
      - name: Package WAL nodes
        run: ./mvnw -B -f wal-ha-reactor/pom.xml -Pdistribution -DskipTests package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/target/surefire-reports/'
